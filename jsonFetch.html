<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Data Fetch</title>
</head>
<body>
    <p id="demo"></p>

    <script>
        async function fetchData() {

            const response = await fetch("json.txt");
            const mainData = await response.text();
            const data = JSON.parse(mainData);

            document.getElementById('demo').textContent = JSON.parse(data.smart_Watch);
            // JSON.stringify(showData)
            // console.log(showData);
        }
        fetchData();
    </script>
    
</body>
</html>
